default_install_hook_types:
  - pre-commit
  - commit-msg
default_stages:
  - pre-commit # Run locally
  - manual # Run in CI
exclude: 'irwkv/third_party/.*|irwkv/models/kimi_k3/nvidia/ops/third_party/.*|irwkv/models/kimi_k3/amd/ops/third_party/.*'
repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.14.0
  hooks:
  - id: ruff-check
    args: [--output-format, github, --fix]
  - id: ruff-format
- repo: https://github.com/crate-ci/typos
  rev: v1.43.5
  hooks:
  - id: typos
    args: [--force-exclude]
- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: v21.1.2
  hooks:
  - id: clang-format
    exclude: 'csrc/libtorch_stable/moe/topk_softmax_kernels.cu|irwkv/third_party/.*'
    types_or: [c++, cuda]
    args: [--style=file, --verbose]
- repo: https://github.com/DavidAnson/markdownlint-cli2
  rev: v0.21.0
  hooks:
  - id: markdownlint-cli2
    language_version: lts
    args: [--config, tools/pre_commit/.markdownlint.yaml, --fix]
- repo: https://github.com/rhysd/actionlint
  rev: v1.7.7
  hooks:
  - id: actionlint
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: 745eface02aef23e168a8afb6b5737818efbea95 # v0.11.0.1
  hooks:
  - id: shellcheck
    args: ["-s", "bash", "--format=gcc", "--rcfile=tools/pre_commit/.shellcheckrc"]
- repo: https://github.com/astral-sh/uv-pre-commit
  rev: 0.11.1
  hooks:
    - id: pip-compile
      alias: pip-compile-docs
      name: pip-compile-docs
      args: [
        requirements/docs.in,
        -o, requirements/docs.txt,
        --python-platform, x86_64-manylinux_2_28,
        --python-version, "3.12",
      ]
      files: ^requirements/docs\.(in|txt)$
- repo: local
  hooks:
  - id: check-agent-files
    name: Check agent instruction files and skills
    language: python
    entry: python tools/pre_commit/check_agent_files.py
    files: ^(\.agents/|\.claude/|(.*/)?(AGENTS|CLAUDE)\.md$|tools/pre_commit/check_agent_files\.py$)
    pass_filenames: false
    additional_dependencies: [PyYAML, regex]
    verbose: true # `note:` lines are advisory, so the hook passes
  - id: mypy # TODO: Use https://github.com/pre-commit/mirrors-mypy when mypy setup is less awkward
    name: Run mypy for the oldest supported Python version
    entry: python tools/pre_commit/mypy.py "3.11"
    language: python
    types_or: [python, pyi]
    require_serial: true
    additional_dependencies: ["mypy==1.20.2", regex, types-cachetools, types-setuptools, types-PyYAML, types-requests, types-torch, "pydantic==2.13.5"]
  - id: png-lint
    name: Lint PNG exports from excalidraw
    entry: tools/pre_commit/png-lint.sh
    language: script
    types: [png]
  - id: signoff-commit
    name: Sign-off Commit
    entry: bash
    args:
      - -c
      - |
        if ! grep -q "^Signed-off-by: $(git config user.name) <$(git config user.email)>" "$(git rev-parse --git-path COMMIT_EDITMSG)"; then
          printf "\nSigned-off-by: $(git config user.name) <$(git config user.email)>\n" >> "$(git rev-parse --git-path COMMIT_EDITMSG)"
        fi
    language: system
    verbose: true
    stages: [commit-msg]
  - id: check-spdx-header
    name: Check SPDX headers
    entry: python tools/pre_commit/check_spdx_header.py
    language: python
    types_or: [python, rust, proto]
  - id: check-root-lazy-imports
    name: Check root lazy imports
    entry: python tools/pre_commit/check_init_lazy_imports.py
    language: python
    types: [python]
  - id: check-filenames
    name: Check for spaces in all filenames
    entry: bash
    args:
      - -c
      - 'git ls-files | grep " " && echo "Filenames should not contain spaces!" && exit 1 || exit 0'
    language: system
    always_run: true
    pass_filenames: false
  - id: check-forbidden-imports
    name: Check for forbidden imports
    entry: python tools/pre_commit/check_forbidden_imports.py
    language: python
    types: [python]
    additional_dependencies: [regex]
  # prevent use torch.cuda APIs
  - id: check-torch-cuda-call
    name: "Prevent new 'torch.cuda' APIs call"
    entry: python tools/pre_commit/check_torch_cuda.py
    language: python
    types: [python]
    additional_dependencies: [regex]
  - id: validate-config
    name: Validate configuration has default values and that each field has a docstring
    entry: python tools/pre_commit/validate_config.py
    language: python
    additional_dependencies: [regex]
  - id: check-boolean-context-manager
    name: Check for boolean ops in with-statements
    entry: python tools/pre_commit/check_boolean_context_manager.py
    language: python
    types: [python]
  # Rust hooks. These shell out to `cargo`; tools/pre_commit/rust-check.sh
  # skips with a warning when cargo is not installed.
  - id: rust-cargo-autoinherit
    name: Rust - Normalize Cargo manifests with autoinherit
    entry: tools/pre_commit/rust-check.sh autoinherit --prefer-simple-dotted
    language: script
    pass_filenames: false
    require_serial: true
    stages: [pre-commit] # Only run locally as Buildkite will cover this
    files: ^rust/(Cargo\.toml|proto/Cargo\.toml|src/.*/Cargo\.toml)$
  - id: rust-cargo-sort
    name: Rust - Sort Cargo manifest sections
    entry: tools/pre_commit/rust-check.sh sort --workspace
    language: script
    pass_filenames: false
    require_serial: true
    stages: [pre-commit] # Only run locally as Buildkite will cover this
    files: ^rust/(Cargo\.toml|proto/Cargo\.toml|src/.*/Cargo\.toml)$
  - id: rust-cargo-fmt
    name: Rust - Format code
    entry: tools/pre_commit/rust-check.sh fmt
    language: script
    pass_filenames: false
    require_serial: true
    stages: [pre-commit] # Only run locally as Buildkite will cover this
    files: ^rust/.*(\.rs|Cargo\.toml|rustfmt\.toml)$
  # Keep `suggestion` last
  - id: suggestion
    name: Suggestion
    entry: bash -c 'echo "To bypass all the pre-commit hooks, add --no-verify to git commit. To skip a specific hook, prefix the commit command with SKIP=<hook-id>."'
    language: system
    verbose: true
    pass_filenames: false
  # Insert new entries above the `suggestion` entry
