[build-system]
# Should be mirrored in requirements/build/cuda.txt
requires = [
    "cmake>=3.26.1",
    "ninja",
    "packaging>=24.2",
    "setuptools>=78.1.1,<81.0.0",
    "setuptools-scm>=8",
    "setuptools-rust>=1.9.0",
    "torch == 2.13.0",
    "wheel",
    "jinja2>=3.1.6",
]
build-backend = "setuptools.build_meta"

[project]
name = "irwkv"
authors = [{name = "irwkv Team"}]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
description = "An inference and serving engine for RWKV models"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.11,<3.15"
dynamic = [ "version", "dependencies", "optional-dependencies"]

[project.scripts]
irwkv = "irwkv.entrypoints.cli.main:main"

[tool.setuptools_scm]
# no extra settings needed, presence enables setuptools-scm

[tool.setuptools.packages.find]
where = ["."]
include = ["irwkv*"]

[tool.ruff.lint.per-file-ignores]
# `irwkv` is the only installed package; everything else is standalone scripts
"!irwkv/**" = ["INP"]
"irwkv/third_party/**" = ["ALL"]
"irwkv/version.py" = ["F401"]
"irwkv/_version.py" = ["ALL"]
# test args are mostly pytest fixtures, which don't benefit from descriptions
"tests/**" = ["D417"]

[tool.ruff.lint]
select = [
    # pydocstyle
    "D",
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-implicit-str-concat
    "ISC",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # flake8-logging-format
    "G",
    # flake8-no-pep420
    "INP",
]
ignore = [
    # don't enforce that everything has a docstring
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
    # unwanted pydocstyle rules
    "D205", "D209", "D301", "D400", "D401", "D404", "D415",
    # incompatible pydocstyle pairs; pin the half `ruff` already picks
    "D203", "D213",
    # star imports
    "F405", "F403",
    # lambda expression assignment
    "E731",
    # zip without `strict=`
    "B905",
    # Loop control variable not used within loop body
    "B007",
    # f-string format
    "UP032",
    # `StrEnum` changes `str()` and `format()` output of members
    "UP042",
]

[tool.ruff.lint.pydocstyle]
ignore-var-parameters = true

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
plugins = ['pydantic.mypy']
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "silent"

[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = ["arg-type", "assignment"]
enable_error_code = ["method-assign"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
markers = [
    "slow_test",
    "skip_global_cleanup",
    "core_model: enable this model test in each PR instead of only nightly",
    "hybrid_model: models that contain mamba layers (including pure SSM and hybrid architectures)",
    "cpu_model: enable this model test in CPU tests",
    "cpu_test: mark test as CPU-only test",
    "split: run this test as part of a split",
    "distributed: run this test only in distributed GPU tests",
    "optional: optional tests that are automatically skipped, include --optional to run them",
]

[tool.coverage.run]
# Track the installed irwkv package (this is what actually gets imported during tests)
# Use wildcard pattern to match the installed location
source = ["irwkv", "*/dist-packages/irwkv", "*/site-packages/irwkv"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/build/*",
    "*/dist/*",
    "*/irwkv.egg-info/*",
    "*/third_party/*",
    "*/examples/*",
    "*/benchmarks/*",
    "*/docs/*",
]

[tool.coverage.paths]
# Map all possible irwkv locations to a canonical "irwkv" path
# This ensures coverage.combine properly merges data from different test runs
source = [
    "irwkv",
    "/irwkv-workspace/src/irwkv",
    "/irwkv-workspace/irwkv",
    "*/site-packages/irwkv",
    "*/dist-packages/irwkv",
]

[tool.coverage.report]
exclude_lines = [
    'pragma: no cover',
    'def __repr__',
    'if self.debug:',
    'if settings.DEBUG',
    'raise AssertionError',
    'raise NotImplementedError',
    'if 0:',
    'if __name__ == .__main__.:',
    'class .*\bProtocol\):',
    '@(abc\.)?abstractmethod',
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.ty.src]
respect-ignore-files = true

[tool.ty.environment]
python = "./.venv"

[tool.typos.files]
# these files may be written in non english words
extend-exclude = ["tests/models/fixtures/*", "tests/prompts/*", "tests/tokenizers_/*",
    "build/*",
    "irwkv/third_party/*", "irwkv/entrypoints/serve/instrumentator/static/*",
    "tests/v1/engine/test_fast_incdec_prefix_err.py", ".git/*", "rust/src/parser/**",
    "rust/src/text/src/output/decoded.rs",
    "rust/src/tokenizer/src/incremental.rs"]
ignore-hidden = false

[tool.typos.default]
extend-ignore-identifiers-re = [".*[Uu][Ee][0-9][Mm][0-9].*"]

[tool.typos.default.extend-identifiers]
a63ede7 = "a63ede7"
bbc5b7ede = "bbc5b7ede"
NOOPs = "NOOPs"
nin_shortcut = "nin_shortcut"
cudaDevAttrMaxSharedMemoryPerBlockOptin = "cudaDevAttrMaxSharedMemoryPerBlockOptin"
sharedMemPerBlockOptin = "sharedMemPerBlockOptin"

depthwise_seperable_out_channel = "depthwise_seperable_out_channel"
pard_token = "pard_token"
ptd_token_id = "ptd_token_id"
ser_de = "ser_de"
shared_memory_per_block_optin = "shared_memory_per_block_optin"
FoPE = "FoPE"
k_ot = "k_ot"
view_seperator = "view_seperator"
inverse_std_variences = "inverse_std_variences"

[tool.typos.default.extend-words]
Hel = "Hel"
wether = "wether"
iy = "iy"
indx = "indx"
# intel cpu features
tme = "tme"
dout = "dout"
Pn = "Pn"
arange = "arange"
thw = "thw"
# temporal position ids (parallels hpos/wpos in vision RoPE)
tpos = "tpos"
subtile = "subtile"
HSA = "HSA"
setp = "setp"
CPY = "CPY"
thr = "thr"
Thr = "Thr"
PARD = "PARD"
pard = "pard"
AKS = "AKS"
ba = "ba"
fo = "fo"
nd = "nd"
eles = "eles"
datas = "datas"
ser = "ser"
ure = "ure"
VALU = "VALU"
# Walsh-Hadamard Transform
wht = "wht"
WHT = "WHT"
# Huawei Compute Architecture for Neural Networks
CANN = "CANN"

[tool.uv]
no-build-isolation-package = ["torch"]
# irwkv depends on oss-harmony, a fork that ships the same `openai_harmony`
# module without downloading tiktoken vocabularies at runtime. Installing
# openai-harmony alongside it silently overwrites those files, so keep it out
# of every resolution; gpt-oss pulls it in transitively.
exclude-dependencies = ["openai-harmony"]
