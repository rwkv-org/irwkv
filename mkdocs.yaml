site_name: irwkv
exclude_docs: |
  /*
  !/README.md
  !/usage/
  !/models/
  /models/*
  !/models/rwkv.md
nav:
  - Home: README.md
  - User Guides:
      - Quickstart & Recipes: usage/quickstart.md
      - Serving, State & Multi-GPU: usage/serving.md
      - LoRA, NoRA & Online RL Sync: usage/rl_and_lora.md
      - Security: usage/security.md
  - Reference:
      - RWKV-7 Architecture & Reference: models/rwkv.md
theme:
  name: material
plugins:
  - search
markdown_extensions:
  - tables
  - fenced_code
  - attr_list
